<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ram Agencies - Place Order</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    min-height: 100vh;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, sans-serif;
}

.navbar {
    background: linear-gradient(90deg, #1e40af, #3b82f6) !important;
}

.card {
    background: rgba(30, 41, 59, 0.85);
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.45);
}

.form-control, .form-select {
    background-color: #1e293b;
    color: white;
    border: 1px solid #334155;
}

.form-control:focus, .form-select:focus {
    background-color: #1e293b;
    color: white;
    border-color: #60a5fa;
    box-shadow: 0 0 0 0.25rem rgba(59,130,246,0.25);
}

.form-select option {
    background-color: #1e293b;
    color: white;
}

.product-row {
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
    padding: 1rem;
    border: 1px solid rgba(255,255,255,0.06);
}

.btn-submit {
    background: linear-gradient(90deg, #3b82f6, #60a5fa);
    border: none;
    font-weight: 600;
}
</style>
</head>
<body>

<nav class="navbar navbar-expand navbar-dark">
<div class="container-fluid px-4">
<span class="navbar-brand">Ram Agencies</span>

<div class="ms-auto">
<a href="/login" class="btn btn-warning btn-sm">
<i class="fa-solid fa-user-shield me-1"></i> Admin Login
</a>
</div>
</div>
</nav>

<div class="container py-5">
<div class="card mx-auto" style="max-width:900px;">
<div class="card-body p-5">

<h3 class="text-center mb-4">
<i class="fa-solid fa-cart-plus me-2"></i>
Place Your Order
</h3>

<form method="POST" action="/place_order">

<div class="mb-4">
<label class="form-label">Shop Name</label>
<input type="text" name="shop_name" class="form-control" required>
</div>

<div class="mb-4">
<label class="form-label">Delivery Address</label>
<textarea name="address" class="form-control" rows="3" required></textarea>
</div>

<div id="product-section">

<div class="product-row row g-3 align-items-end mb-3">

<div class="col-md-5">
<label class="form-label">Product</label>
<select name="product_id[]" class="form-select" required>
<option value="" disabled selected>Select product...</option>
{% for product in products %}
<option value="{{ product['id'] }}">
{{ product['name'] }} — ₹{{ product['price'] }}
</option>
{% endfor %}
</select>
</div>

<div class="col-md-4">
<label class="form-label">Quantity</label>
<input type="number" name="quantity[]" class="form-control" min="1" required>
</div>

<div class="col-md-3">
<button type="button" class="btn btn-danger remove-btn w-100">
Remove
</button>
</div>

</div>
</div>

<button type="button" class="btn btn-secondary w-100 mb-3" onclick="addProduct()">
+ Add Another Product
</button>

<button type="submit" class="btn btn-submit w-100">
Place Order Now
</button>

</form>

</div>
</div>
</div>

<script>
function addProduct() {
    const section = document.getElementById("product-section");
    const firstRow = document.querySelector(".product-row");
    const newRow = firstRow.cloneNode(true);

    newRow.querySelectorAll("input").forEach(input => input.value = "");
    newRow.querySelector("select").selectedIndex = 0;

    section.appendChild(newRow);
}

document.addEventListener("click", function(e) {
    if (e.target.closest(".remove-btn")) {
        const rows = document.querySelectorAll(".product-row");
        if (rows.length > 1) {
            e.target.closest(".product-row").remove();
        } else {
            alert("At least one product is required!");
        }
    }
});
</script>

</body>
</html>
